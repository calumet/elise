name: package-test

on:
  push:
    branches:
      - master

jobs:
  # `NODE_AUTH_TOKEN` va a nivel de job y no en el paso de publicar: el
  # `install` también lo necesita, porque el workspace incluye `packages/site` y
  # este depende de paquetes privados de la organización. Sin el token en ese
  # paso, `setup-node` deja el marcador sin resolver en el .npmrc y la descarga
  # sale con 401. Es lo mismo que ya hace ci.yml.
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@calumet"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@calumet/elise-*" build

      - run: pnpm -r --filter "@calumet/elise-*" publish --no-git-checks

  # JSR publica el fuente TypeScript, no el build, así que este job no compila.
  # `id-token: write` es toda la autenticación de la publicación: JSR valida el
  # token OIDC contra el repositorio enlazado en la configuración de cada
  # paquete, y no hay ningún secreto que rotar. `jsr publish` lee el workspace de
  # deno.json y sube los ocho paquetes en una sola pasada, saltándose los que ya
  # tengan publicada esa versión -- por eso puede correr en cada push a master
  # sin tropezar.
  #
  # El registro de GitHub Packages entra igual, aunque acá no se publique en él,
  # porque la instalación previa baja de ahí los privados de la organización.
  publish-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@calumet"
          cache: pnpm

      # Deno resuelve las dependencias contra node_modules (byonm), así que sin
      # instalar no encuentra ni react ni los primitivos de Radix.
      - run: pnpm install --frozen-lockfile

      # JSR no transpila los .tsx al armar el tarball de npm, y los deja crudos
      # con los especificadores `npm:` sin resolver, de modo que el paquete no
      # se puede importar desde Vite ni desde Node. Por eso lo que se publica es
      # la salida de tsc, que ya no tiene JSX.
      - run: pnpm --filter "@calumet/elise-*" build

      - run: pnpm exec jsr publish
