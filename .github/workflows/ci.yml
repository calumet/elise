name: ci

on:
  pull_request:
  push:
    branches:
      - master

# `site` depende de `@calumet/suamox-*`, que vive en GitHub Packages. Ese
# registro pide token aunque el paquete sea publico, asi que los jobs necesitan
# permiso de lectura y `NODE_AUTH_TOKEN`. Los `@calumet/elise-*` no lo pedian
# porque son `workspace:*` y nunca se descargan.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@calumet"

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Cubre lo que el build no ve: que la versión de los dos manifiestos
      # coincida, y que el fuente siga cumpliendo las reglas de tipos de JSR.
      # Sin esto el desajuste solo se nota cuando alguien busca en jsr.io una
      # versión que nunca llegó.
      - name: Publicación en JSR
        run: pnpm jsr:check

      - name: Build
        run: pnpm build

  # La auditoria visual necesita el showcase corriendo y un Chromium, asi que va
  # en un job aparte: si falla, no bloquea el merge por una diferencia de render
  # entre el runner y una maquina local.
  auditoria-visual:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@calumet"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build

      - name: Levantar el showcase
        run: |
          pnpm --filter showcase preview --port 5173 &
          timeout 60 bash -c 'until curl -sf http://localhost:5173 >/dev/null; do sleep 1; done'

      - name: Auditar
        run: node scripts/audit-visual.mjs -- --tema=ambos --abrir
